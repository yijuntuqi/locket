# Netlify SPA 部署配置：构建 + react-router 直链回退
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 带哈希的构建产物长缓存（文件名含哈希，内容变则名变）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
