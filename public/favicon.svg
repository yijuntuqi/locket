<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ecd2"/>
      <stop offset=".55" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#b8935a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e1e"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 吊坠环 -->
  <circle cx="32" cy="17" r="6.5" fill="none" stroke="url(#gilt)" stroke-width="3.5"/>
  <!-- 坠身：暗面镜腔 -->
  <ellipse cx="32" cy="40" rx="15" ry="17" fill="url(#gilt)"/>
  <ellipse cx="32" cy="40" rx="10.5" ry="12.5" fill="#101426"/>
  <!-- 坠面里的心 -->
  <path d="M32 45.5c-3.2-2.4-5.5-4.4-5.5-7a3.1 3.1 0 0 1 5.5-2 3.1 3.1 0 0 1 5.5 2c0 2.6-2.3 4.6-5.5 7z" fill="url(#gilt)"/>
</svg>
